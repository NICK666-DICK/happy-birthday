<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>生日快乐</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;}
body{
  height:100vh;
  background:#000;
  display:flex;
  justify-content:center;
  align-items:center;
  color:#fff;
  font-family:"Microsoft YaHei",sans-serif;
  overflow:hidden;
}
.container{text-align:center;}
h1{font-size:2.5em;margin-bottom:20px;}
.progress{
  width:300px;height:20px;
  border:2px solid #fff;
  border-radius:10px;
  margin:0 auto;
  overflow:hidden;
}
.bar{
  width:0;height:100%;
  background:#f00;
}
/* 整蛊图片默认隐藏 */
.scary-image{
  position:fixed;
  top:0;left:0;
  width:100vw;height:100vh;
  background:#000;
  display:none;
  justify-content:center;
  align-items:center;
  z-index:9999;
}
.scary-image img{
  max-width:100%;
  max-height:100%;
}
/* 震动效果 */
.shake{
  animation:shake 0.1s infinite;
}
@keyframes shake{
  0%{transform:translate(2px,2px);}
  50%{transform:translate(-2px,-2px);}
  100%{transform:translate(2px,2px);}
}
</style>
</head>
<body>
<div class="container">
  <h1>生日快乐 🎂</h1>
  <div class="progress">
    <div class="bar" id="bar"></div>
  </div>
  <p style="margin-top:20px;">加载中...</p>
</div>

<!-- 整蛊图片（现在先空着，后面再加照片） -->
<div class="scary-image" id="scary-image">
  <!-- 以后你要加图，就把下面注释打开，换成你的图片名 -->
  <!-- <img src="pic.jpg" alt=""> -->
</div>

<!-- 音频：已经帮你设为恐怖尖叫 -->
<audio id="alert-sound" preload="auto">
  <source src="https://assets.mixkit.co/sfx/preview/mixkit-scary-scream-1207.mp3" type="audio/mpeg">


<script>
let bar=document.getElementById('bar');
let width=0;
let timer=setInterval(function(){
  width+=1;
  bar.style.width=width+"%";
  if(width>=100){
    clearInterval(timer);
    // 进度条走完：出声+震动+闪图
    document.getElementById('alert-sound').play().catch(e=>{});
    document.getElementById('scary-image').style.display='flex';
    document.body.classList.add('shake');
    setTimeout(()=>{
      document.getElementById('scary-image').style.display='none';
      document.body.classList.remove('shake');
    },1000);
  }
},30);
</script>
</body>
</html>
