<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>生日快乐</title>
<style>
* {margin:0;padding:0;box-sizing:border-box;}
body {
  height:100vh;
  background:#000;
  display:flex;
  justify-content:center;
  align-items:center;
  color:#fff;
  font-family:"Microsoft YaHei",sans-serif;
}
.container {text-align:center;}
h1 {font-size:2.5em;margin-bottom:20px;}
.progress {
  width:300px;height:20px;
  border:2px solid #fff;
  border-radius:10px;
  margin:0 auto;
  overflow:hidden;
}
.bar {
  width:0;height:100%;
  background:#f00;
}
</style>
</head>
<body>
<div class="container">
  <h1>生日快乐 🎂</h1>
  <div class="progress">
    <div class="bar" id="bar"></div>
  </div>
  <p style="margin-top:20px;">点击页面任意处开始</p>
</div>

<!-- 只留声音，不用图片 -->
<audio id="scream" preload="auto" src="https://cdn.pixabay.com/audio/2021/08/30/audio_2d7d587ebf.mp3">

<script>
let bar = document.getElementById('bar');
let width = 0;
let timer = null;
let started = false;
let scream = document.getElementById('scream');

document.body.addEventListener('click', () => {
  if (started) return;
  started = true;

  // 先唤醒音频（浏览器必须有这一步）
  scream.play().then(() => {
    scream.pause();
    scream.currentTime = 0;
  });

  // 进度条
  timer = setInterval(() => {
    width += 1;
    bar.style.width = width + '%';
    if (width >= 100) {
      clearInterval(timer);
      // 进度条满 → 尖叫
      scream.currentTime = 0;
      scream.play();
    }
  }, 30);
});
</script>
</body>
</html>
